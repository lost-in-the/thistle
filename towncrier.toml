# One config, two package roots: --dir . (core) or --dir map (Map).
[tool.towncrier]
package = ""
name = ""
directory = "changelog"
filename = "CHANGELOG.md"
template = "towncrier:default.md"
title_format = "## {version} ({project_date})"
issue_format = "[#{issue}](https://github.com/lost-in-the/thistle/issues/{issue})"
issue_pattern = "[1-9][0-9]*"
wrap = false
# An explicit empty ignore list makes build reject unknown fragment names.
ignore = []

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "build"
name = "Build"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "dependencies"
name = "Dependencies"
showcontent = true

[[tool.towncrier.type]]
directory = "documentation"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "performance"
name = "Performance"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[[tool.towncrier.type]]
directory = "testing"
name = "Testing"
showcontent = true

[[tool.towncrier.type]]
directory = "upgrade-notes"
name = "Upgrade Notes"
showcontent = true
